services:
  - type: web
    name: alphajourney
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Python
      - key: PYTHON_VERSION
        value: 3.11.0
      
      # Database
      - key: DATABASE_URL
        value: # URL PostgreSQL (ex: postgresql://user:pass@ep-xxx.neon.tech/db)
      
      # Facebook
      - key: FB_ACCESS_TOKEN
        sync: false  # Secret - à configurer dans le dashboard
      - key: FB_PAGE_ID
        sync: false  # Secret - à configurer dans le dashboard
      
      # LLM APIs (au moins 1 requis)
      - key: GROQ_API_KEY
        sync: false  # PRIORITÉ #1 - Recommandé
      - key: GEMINI_API_KEY
        sync: false  # Backup
      
      # Image APIs (optionnels mais recommandés)
      - key: UNSPLASH_ACCESS_KEY
        sync: false  # Pour photos gratuites - RECOMMANDÉ
      - key: PEXELS_API_KEY
        sync: false  # Backup images
      
      # Configuration publication
      - key: PUBLICATION_HOUR
        value: 14  # Heure de publication (format 24h)
      - key: PUBLICATION_MINUTE
        value: 0   # Minute de publication
      
      # Environnement
      - key: ENVIRONMENT
        value: production