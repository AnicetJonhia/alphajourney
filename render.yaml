# ================================================
# AlphaJourney - Configuration Render
# 2 services : Web API + Cron Job
# ================================================

services:
  # ================================================
  # SERVICE 1 : API Web (peut dormir)
  # Endpoints : /health, /stats, /publish-now
  # ================================================
  - type: web
    name: alphajourney-api
    env: python
    region: oregon
    plan: free
    
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      # Python
      - key: PYTHON_VERSION
        value: 3.12.2
      
      # Database (Neon)
      - key: DATABASE_URL
        sync: false
      
      # Facebook
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      
      # LLM APIs
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      
      # Images APIs
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      
      # Auto-engagement
      - key: AUTO_LIKE
        value: "true"
      - key: AUTO_COMMENT
        value: "true"
      - key: ENGAGEMENT_DELAY
        value: "5"
      
      # Publication
      - key: PUBLICATION_HOUR
        value: "19"
      - key: PUBLICATION_MINUTE
        value: "0"
      - key: TIMEZONE
        value: "Indian/Antananarivo"
      
      # Environnement
      - key: ENVIRONMENT
        value: production
  
  # ================================================
  # SERVICE 2 : Cron Job (publication quotidienne)
  # S'exécute tous les jours à 16h UTC = 19h Madagascar
  # ================================================
  - type: cron
    name: alphajourney-publisher
    env: python
    region: oregon
    plan: free
    
    # Schedule : 19h Madagascar (UTC+3) = 16h UTC
    schedule: "0 16 * * *"
    
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/publish.py
    
    envVars:
      # Python
      - key: PYTHON_VERSION
        value: 3.12.2
      
      # Database (partagée avec le service web)
      - key: DATABASE_URL
        sync: false
      
      # Facebook (partagées avec le service web)
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      
      # LLM APIs (partagées avec le service web)
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      
      # Images APIs (partagées avec le service web)
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      
      # Auto-engagement (partagé)
      - key: AUTO_LIKE
        value: "true"
      - key: AUTO_COMMENT
        value: "true"
      - key: ENGAGEMENT_DELAY
        value: "5"
      
      # Publication (non utilisé par cron mais nécessaire)
      - key: PUBLICATION_HOUR
        value: "19"
      - key: PUBLICATION_MINUTE
        value: "0"
      - key: TIMEZONE
        value: "Indian/Antananarivo"
      
      # Environnement
      - key: ENVIRONMENT
        value: production