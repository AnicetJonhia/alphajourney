
services:
  - type: web
    name: alphajourney
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: # Votre URL Neon PostgreSQL
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: PUBLICATION_HOUR
        value: 14
      - key: PUBLICATION_MINUTE
        value: 0
      - key: ENVIRONMENT
        value: production