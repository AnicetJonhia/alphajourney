services:
  # ================================================
  # Service Web API
  # ================================================
  - type: web
    name: alphajourney-api
    env: python
    region: oregon
    plan: free
    
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        sync: false
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: AUTO_LIKE
        value: "true"
      - key: AUTO_COMMENT
        value: "true"
      - key: ENGAGEMENT_DELAY
        value: "5"
      
      # Configuration dynamique (modifiable dans Dashboard)
      - key: PUBLICATION_HOUR
        sync: false  # ← Configurable dans Dashboard
      - key: PUBLICATION_MINUTE
        sync: false  # ← Configurable dans Dashboard
      - key: TIMEZONE
        value: "Indian/Antananarivo"
      
      - key: ENVIRONMENT
        value: production
  
  # ================================================
  # Cron Job - Vérifie TOUTES LES HEURES
  # Le script décide lui-même s'il doit publier
  # ================================================
  - type: cron
    name: alphajourney-publisher
    env: python
    region: oregon
    plan: free
    
    # Toutes les heures à XX:00 (vérifie PUBLICATION_HOUR dans le script)
    schedule: "0 * * * *"
    
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/publish.py
    
    # Mêmes variables (synchronisées)
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        sync: false
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: AUTO_LIKE
        value: "true"
      - key: AUTO_COMMENT
        value: "true"
      - key: ENGAGEMENT_DELAY
        value: "5"
      - key: PUBLICATION_HOUR
        sync: false  
      - key: PUBLICATION_MINUTE
        sync: false
      - key: TIMEZONE
        value: "Indian/Antananarivo"
      - key: ENVIRONMENT
        value: production

