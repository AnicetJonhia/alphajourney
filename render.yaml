# ================================================
# AlphaJourney - Configuration Render
# Service Web uniquement (GitHub Actions gère le scheduling)
# ================================================

services:
  - type: web
    name: alphajourney
    env: python
    region: oregon
    plan: free
    
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      # Python
      - key: PYTHON_VERSION
        value: 3.12.2
      
      # Database (Neon PostgreSQL)
      - key: DATABASE_URL
        sync: false
      
      # Facebook Graph API
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      
      # LLM APIs (au moins 1 requis)
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      
      # Image APIs (optionnels mais recommandés)
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      
      # Auto-engagement
      - key: AUTO_LIKE
        value: "true"
      - key: AUTO_COMMENT
        value: "true"
      - key: ENGAGEMENT_DELAY
        value: "5"
      
      # Timezone (pour logs et /stats)
      - key: TIMEZONE
        value: "Indian/Antananarivo"
      
      # Environnement
      - key: ENVIRONMENT
        value: production