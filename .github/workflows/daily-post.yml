name: AlphaJourney - Publication quotidienne

on:
  schedule:
    # Tous les jours à 16h UTC = 19h Madagascar (UTC+3)
    - cron: '0 1 * * *'
  
  # Test manuel
  workflow_dispatch:

env:
  API_URL: https://alphajourney.onrender.com

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 🚀 Publication quotidienne
        run: |
          echo "📤 Publication AlphaJourney"
          echo "🕐 $(date -u '+%Y-%m-%d %H:%M:%S UTC') ($(TZ='Indian/Antananarivo' date '+%H:%M %Z'))"
          
          # Appel avec timeout étendu pour cold start
          response=$(curl -X POST \
            -s -w "\n%{http_code}" \
            ${{ env.API_URL }}/publish-now \
            --max-time 180)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Publication réussie"
            echo "$body" | jq '.' 2>/dev/null || echo "$body"
          else
            echo "❌ Échec (HTTP $http_code)"
            echo "$body"
            exit 1
          fi