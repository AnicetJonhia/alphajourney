name: AlphaJourney - Publication quotidienne

on:
  schedule:
    # 16h UTC = 19h Madagascar
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: alphajourney-daily
  cancel-in-progress: false

env:
  API_URL: https://alphajourney.onrender.com

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🚀 Publication quotidienne
        run: |
          echo "📤 Publication AlphaJourney"
          echo "🕐 UTC : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "🕐 Madagascar : $(TZ='Indian/Antananarivo' date '+%Y-%m-%d %H:%M:%S %Z')"

          response=$(curl -X POST \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            -s -w "\n%{http_code}" \
            ${{ env.API_URL }}/publish-now \
            --max-time 180)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ]; then
            echo "✅ Publication réussie"
            echo "$body" | jq '.' 2>/dev/null || echo "$body"
          else
            echo "❌ Échec (HTTP $http_code)"
            echo "$body"
            exit 1
          fi
